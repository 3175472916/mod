plugins {
    // 26.1 起 Minecraft 不再混淆，必须用非重映射版 Loom：
    //   net.fabricmc.fabric-loom        -> 26.1+（不混淆）
    //   net.fabricmc.fabric-loom-remap  -> 1.21.11 及更早（混淆）
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 非重映射模式没有 modImplementation / modApi 这些配置，
    // 直接用 implementation；Fabric API 的各个模块会通过 POM 依赖传递进来。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
