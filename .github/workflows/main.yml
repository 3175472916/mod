name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is in the repo
        run: |
          echo "--- files in repo root ---"
          ls -la
          echo "--- loom plugin line ---"
          grep -n "fabric-loom" build.gradle || echo "!! build.gradle has NO fabric-loom line"
          echo "--- java ---"
          java -version

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Gradle version
        run: gradle --version || true

      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineboard-build
          path: |
            build/libs/*.jar
            build.log
          if-no-files-found: warn
